name: Build AppImage & Publish Release

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build VIXGlitcher x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev squashfs-tools python3-pip unzip curl ca-certificates
          mkdir -p /tmp/sdl2_pkg /tmp/sdl2_lib
          python3 -m pip download --no-deps pysdl2-dll -d /tmp/sdl2_pkg
          unzip -q /tmp/sdl2_pkg/pysdl2_dll*.whl -d /tmp/sdl2_pkg
          cp /tmp/sdl2_pkg/sdl2dll/dll/libSDL2-2.0.so /tmp/sdl2_lib/libSDL2-2.0.so.0
          ln -sf libSDL2-2.0.so.0 /tmp/sdl2_lib/libSDL2.so

      - name: Download official AppImage Type-2 FUSE3 runtime
        run: |
          curl -fsSL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            -o /tmp/runtime-x86_64
          chmod +x /tmp/runtime-x86_64

      - name: Build VIXGlitcher AppImage & Source Archive
        run: |
          RUNTIME_BIN="/tmp/runtime-x86_64" ./scripts/build-appimage.sh
          ./dist/VIXGlitcher-x86_64.AppImage --appimage-extract-and-run --dump-ui-preview /tmp/ci_smoke
          git archive --format=tar.gz --prefix=vixglitcher-1.0.0/ -o dist/vixglitcher-1.0.0-source.tar.gz HEAD
          ls -lh dist/ /tmp/ci_smoke_*.png

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIXGlitcher-x86_64-AppImage
          path: |
            dist/VIXGlitcher-x86_64.AppImage
            dist/VIXGlitcher-x86_64.AppImage.sha256
            dist/vixglitcher-1.0.0-source.tar.gz

      - name: Create or Update GitHub Release v1.0.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          printf '%s\n' \
            '## VIXGlitcher v1.0.0 — Arch Linux (`x86_64` AppImage & Open Source)' \
            '' \
            'Нативный видеоплеер под **Arch Linux** (Wayland & X11) с чистым чёрным фоном (`#000000`), полноценным движком **`mpv` (`libmpv`)** под капотом и кастомным GPU-интерфейсом в стилистике **тёмного неонового сиреневого (Dark Neon Lilac)**.' \
            '' \
            '### Быстрый запуск на Arch Linux' \
            '```bash' \
            'sudo pacman -S mpv' \
            'chmod +x VIXGlitcher-x86_64.AppImage' \
            './VIXGlitcher-x86_64.AppImage' \
            '```' \
            '' \
            '### Прикреплённые файлы' \
            '- **`VIXGlitcher-x86_64.AppImage`** — готовый портативный исполняемый файл AppImage (`x86_64`, FUSE3 Type-2)' \
            '- **`VIXGlitcher-x86_64.AppImage.sha256`** — контрольная сумма SHA-256' \
            '- **`vixglitcher-1.0.0-source.tar.gz`** + архивы открытого исходного кода (MIT Open Source)' \
            > /tmp/release_notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/VIXGlitcher-x86_64.AppImage \
              dist/VIXGlitcher-x86_64.AppImage.sha256 \
              dist/vixglitcher-1.0.0-source.tar.gz \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/VIXGlitcher-x86_64.AppImage \
              dist/VIXGlitcher-x86_64.AppImage.sha256 \
              dist/vixglitcher-1.0.0-source.tar.gz \
              --target main \
              --title "VIXGlitcher v1.0.0 (Arch Linux AppImage & Open Source)" \
              --notes-file /tmp/release_notes.md
          fi
